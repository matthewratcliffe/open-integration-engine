#
# mTLS front door for Open Integration Engine.
#
# Core OIE terminates TLS only on the admin/API port (8443) with a
# self-signed keystore, and never verifies client certificates. The channel
# HTTP and TCP listeners are plaintext. So: nginx verifies the client
# certificate here and forwards to the engine over the private compose
# network, passing the verified identity along as request headers that a
# channel or the API can make authorisation decisions on.
#

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;

    log_format mtls '$remote_addr - "$ssl_client_s_dn" [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'verify=$ssl_client_verify serial=$ssl_client_serial';
    access_log /var/log/nginx/access.log mtls;

    sendfile        on;
    keepalive_timeout  65;
    # HL7/FHIR payloads and channel imports can be large; 0 = no limit.
    client_max_body_size 0;

    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Trust anchor for client certificates. Swap in your own CA, or concatenate
    # several PEM CAs into this one file to trust more than one issuer.
    ssl_client_certificate /etc/nginx/certs/clients-ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    # The engine's own cert is the self-signed one it generates into
    # appdata/keystore.jks, so this hop is encrypted but not verified. It never
    # leaves the compose network.
    proxy_ssl_verify off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # The verified client identity. A channel reads these from the source map
    # (sourceMap.get('headers')) to authorise per-sender; the API can be
    # restricted by DN at this layer instead.
    proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
    proxy_set_header X-Client-Cert-DN     $ssl_client_s_dn;
    proxy_set_header X-Client-Cert-Issuer $ssl_client_i_dn;
    proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
    proxy_set_header X-Client-Cert-SHA1   $ssl_client_fingerprint;
    # Strip anything a caller tried to spoof on the way in.
    proxy_set_header X-Client-Cert        "";

    ########################################################################
    # Admin UI + REST API
    ########################################################################
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass https://engine:8443;
            # Long-poll endpoints the Administrator uses (dashboard updates).
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }

    ########################################################################
    # Channel HTTP ingress
    ########################################################################
    # One server block per channel listener port. The engine binds 8081 only
    # once a channel with an HTTP Listener on 8081 is deployed, so nginx must
    # resolve it lazily -- hence the variable in proxy_pass plus a resolver.
    server {
        listen 8444 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Docker's embedded DNS. valid= keeps nginx from caching a failure
        # forever if it starts before the channel is deployed.
        resolver 127.0.0.11 valid=10s ipv6=off;

        location / {
            set $upstream_channel "http://engine:8081";
            proxy_pass $upstream_channel$request_uri;
            proxy_read_timeout 120s;
        }
    }
}

########################################################################
# MLLP over TLS
########################################################################
# HL7v2 over TLS, verified client certificate, forwarded to a plain TCP
# Listener inside the network. This is the piece people usually buy the Zen
# extension for.
stream {
    log_format mtls_stream '$remote_addr "$ssl_client_s_dn" '
                           'verify=$ssl_client_verify '
                           '$protocol $status $bytes_sent/$bytes_received '
                           '$session_time';
    access_log /var/log/nginx/stream.log mtls_stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream mllp {
        server engine:6661 max_fails=0;
    }

    server {
        listen 6662 ssl;

        ssl_protocols          TLSv1.3 TLSv1.2;
        ssl_certificate        /etc/nginx/certs/server.crt;
        ssl_certificate_key    /etc/nginx/certs/server.key;
        ssl_client_certificate /etc/nginx/certs/clients-ca.crt;
        ssl_verify_client      on;
        ssl_verify_depth       2;

        proxy_pass mllp;
        # MLLP senders hold the connection open between messages.
        proxy_timeout 10m;
        proxy_connect_timeout 10s;
    }
}
