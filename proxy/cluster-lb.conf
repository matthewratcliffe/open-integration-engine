#
# Round-robin front door for a local multi-engine stack.
#
# Used by compose.cluster.yaml to stand in for what a Kubernetes Service does in
# a real deployment: one address, several engines behind it, connections spread
# across them.
#
# TCP passthrough, not termination. The engines' admin listener speaks TLS with
# the keystore every node shares, so nginx has nothing useful to add by
# decrypting and re-encrypting -- and passing the bytes through means the
# certificate a client sees is the engine's own, exactly as it is when talking
# to one directly.
#
# Channel traffic is deliberately plain round robin rather than ip_hash. Session
# affinity would hide the property this stack is meant to demonstrate: with
# SESSION_STORE=true the session lives in PostgreSQL, so consecutive requests
# can land on different engines and still be the same logged-in session. If the
# console logs you out while clicking around here, that is the finding -- not
# something to paper over with stickiness.
#
# The admin listener is the exception: it is pinned to the utility node. The
# utility-only extensions -- git sync, the data pruner, the volume monitor --
# are installed on `engine` alone, because OIE_DISABLE_EXTENSIONS strips them
# from the workers; they own singleton jobs that must not run three times over.
# A console served by a worker therefore has no backend for those panels and
# renders them unavailable, which round robin turned into a two-in-three coin
# toss per login. Pinning costs the session bounce through *this* door; to
# exercise it deliberately, hit the nodes directly on 18443/18444/18445, which
# compose.cluster.yaml publishes for exactly that purpose.
#

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    log_format cluster '$remote_addr [$time_local] -> $upstream_addr '
                       '$protocol $status $bytes_sent/$bytes_received '
                       '$session_time';
    access_log /var/log/nginx/access.log cluster;

    # max_fails/fail_timeout are nginx's passive health checks: a node that
    # refuses two connections is taken out of rotation for ten seconds and then
    # tried again. That is what keeps a rolling restart from returning errors
    # to clients -- and it is the open-source equivalent of the readiness probe
    # the Kubernetes manifests use.
    # Pinned to the utility node -- see the note at the top of this file. Adding
    # the two worker lines back restores round robin, at the cost of the git
    # sync, data pruner and volume monitor panels working only one login in
    # three.
    upstream oie_admin {
        server engine:8443       max_fails=2 fail_timeout=10s;
    }

    # Channel listeners. Only the ports your deployed channels actually bind
    # need to be here; these two match the examples in compose.dev.yaml.
    upstream oie_channel_http {
        server engine:8081       max_fails=2 fail_timeout=10s;
        server engine-w1:8081    max_fails=2 fail_timeout=10s;
        server engine-w2:8081    max_fails=2 fail_timeout=10s;
    }

    upstream oie_channel_mllp {
        server engine:6661       max_fails=2 fail_timeout=10s;
        server engine-w1:6661    max_fails=2 fail_timeout=10s;
        server engine-w2:6661    max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8443;
        proxy_pass oie_admin;
        # The Swing Administrator and long API calls (a deploy of many channels)
        # both sit idle mid-request; the default 10 minutes is not enough.
        proxy_timeout 30m;
        proxy_connect_timeout 5s;
    }

    server {
        listen 8081;
        proxy_pass oie_channel_http;
        proxy_connect_timeout 5s;
    }

    server {
        # MLLP connections are long-lived by design: a sender opens one and
        # keeps it. Balancing is therefore per connection, not per message --
        # one busy sender stays on one engine until it reconnects.
        listen 6661;
        proxy_pass oie_channel_mllp;
        proxy_timeout 24h;
        proxy_connect_timeout 5s;
    }
}
