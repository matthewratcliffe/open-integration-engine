name: tests

# Full test suite for the OIE Docker stack and the plugins built in this repo.
#
# Tiers, fast to slow:
#   js-unit       node --test over every plugin's webadmin pure-logic mirror
#   java-unit     compile + run the plugins' dependency-free Java unit tests
#   shell-unit    bats over the pure logic in entrypoint.sh / oie-config-push.sh
#   shellcheck    static analysis of every script
#   lint-static   XML well-formedness + channel-id rules, YAML, compose config
#   integration   build the engine image, stand up Postgres + engine, install
#                 every extension, push config/ and assert no channel became an
#                 InvalidChannel and each reached a deployed state
#
# The first five need no Docker and run in parallel in well under a minute.
# integration builds the image and is the long pole; it only runs after the
# cheap tiers are green.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-unit:
    name: JS unit (webadmin logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run node --test in every plugin test dir
        shell: bash
        run: |
          set -euo pipefail
          # Every *.test.mjs lives in a plugin (or overlay) test/ directory.
          mapfile -t dirs < <(find plugins extensions -name '*.test.mjs' -exec dirname {} \; | sort -u)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "no JS test directories found"; exit 1
          fi
          rc=0
          for d in "${dirs[@]}"; do
            echo "==> $d"
            ( cd "$d" && node --test ) || rc=1
          done
          exit $rc

  java-unit:
    name: Java unit (pure plugin logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run each self-contained Java test
        shell: bash
        run: |
          set -euo pipefail
          # The 12 first-party plugins (and their Java tests) now live in their
          # own repos -- see docker/Dockerfile's OIE_BUILTIN_PLUGIN_URLS -- so
          # plugins/ is normally empty here. Look for any src still under it
          # (or under extensions/, for overlays) and skip cleanly if there is
          # nothing to compile, rather than failing a run with nothing left to
          # test.
          mapfile -t tests < <(find plugins extensions -path '*/test/java/*Test.java' 2>/dev/null | sort)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "no Java tests found under plugins/ or extensions/ (expected now that the first-party plugins are external repos) -- skipping"
            exit 0
          fi
          rc=0
          for t in "${tests[@]}"; do
            plugin_root="${t%/test/java/*}"
            name="$(basename "${t%.java}")"
            out="$(mktemp -d)"
            echo "==> $t"
            # Compile the test together with the plugin's whole src tree, then
            # run the test class (its main() exits non-zero on any failure).
            if javac -d "$out" $(find "$plugin_root/src" -name '*.java') "$t" \
               && java -cp "$out" "$name"; then
              echo "    ok"
            else
              echo "    FAILED"; rc=1
            fi
          done
          exit $rc

  shell-unit:
    name: Shell unit (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats
        run: bats test/shell/*.bats

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint every script
        shell: bash
        run: |
          set -euo pipefail
          # scripts/, the entrypoint, and any build.sh. -x follows `source`.
          mapfile -t files < <(find scripts docker plugins -name '*.sh' | sort)
          printf '%s\n' "${files[@]}"
          shellcheck -x "${files[@]}"

  lint-static:
    name: Static (XML / YAML / compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils yamllint
      - name: Channel XML well-formedness, ids, and duplicates
        shell: bash
        run: |
          set -euo pipefail
          status=0
          shopt -s nullglob
          for f in config/channels/*.xml; do
            xmllint --noout "$f" || { echo "$f: not well-formed XML"; status=1; continue; }
            id="$(xmllint --xpath 'string(/channel/id)' "$f" 2>/dev/null || true)"
            [ -n "$id" ] || { echo "$f: no /channel/id -- export it from the Administrator"; status=1; }
          done
          # Every other tracked XML (code templates, groups, plugin metadata templates).
          for f in config/code-templates/**/*.xml config/*.xml; do
            [ -e "$f" ] || continue
            xmllint --noout "$f" || { echo "$f: not well-formed XML"; status=1; }
          done
          # Duplicate channel ids would make push order decide which file wins.
          if compgen -G 'config/channels/*.xml' >/dev/null; then
            dupes="$(xmllint --xpath '//channel/id/text()' config/channels/*.xml 2>/dev/null \
                     | tr -d ' ' | sort | uniq -d || true)"
            [ -z "$dupes" ] || { echo "duplicate channel ids: $dupes"; status=1; }
          fi
          exit $status
      - name: YAML lint (compose + k8s)
        shell: bash
        run: |
          # Relaxed rules: these files are hand-maintained, so flag real errors
          # (syntax, duplicate keys) rather than cosmetic line length.
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' \
            compose*.yaml deploy/k8s/*.yaml .github/workflows/*.yml
      - name: docker compose config parses
        run: docker compose -f compose.yaml config >/dev/null

  integration:
    name: Integration (engine + Postgres + config push)
    runs-on: ubuntu-latest
    needs: [js-unit, java-unit, shell-unit, shellcheck, lint-static]
    env:
      OIE_VERSION: "4.6.0"
      OIE_SHA256: "7c82e79027e671277e1d78d0f7bbb1c53ddf1be476f1e80c2ddbfcf7855900ea"
    steps:
      - uses: actions/checkout@v4

      - name: Install client tools
        run: sudo apt-get update && sudo apt-get install -y curl libxml2-utils

      - name: Build the engine image
        run: |
          docker build \
            --build-arg "OIE_VERSION=${OIE_VERSION}" \
            --build-arg "OIE_SHA256=${OIE_SHA256}" \
            --tag oie/engine:${OIE_VERSION} \
            ./docker

      # The 12 first-party plugins (FHIR, SFTP, Null Connector, Random
      # Generator, ...) used to be built from source here; they now live in
      # their own repos and are fetched + baked into extensions.dist/ inside
      # the image build above, via OIE_BUILTIN_PLUGIN_URLS (docker/Dockerfile).
      # NOTE: until each of those 12 repos has a real release, that build arg
      # points at placeholder version/checksums and the image build step above
      # will fail to fetch them -- see the Dockerfile comment on
      # OIE_BUILTIN_PLUGIN_URLS.

      - name: Start Postgres
        run: |
          docker network create oie-ci
          docker run -d --name db --network oie-ci \
            -e POSTGRES_DB=mirthdb -e POSTGRES_USER=mirthdb \
            -e POSTGRES_PASSWORD=ci-throwaway \
            postgres:18-alpine

      - name: Start the engine
        run: |
          docker run -d --name engine --network oie-ci \
            -p 127.0.0.1:8443:8443 \
            -e DATABASE=postgres \
            -e DATABASE_URL=jdbc:postgresql://db:5432/mirthdb \
            -e DATABASE_USERNAME=mirthdb \
            -e DATABASE_PASSWORD=ci-throwaway \
            -e DATABASE_MAX_RETRY=30 \
            -e DATABASE_RETRY_WAIT=3000 \
            -e KEYSTORE_STOREPASS=ci-throwaway \
            -e KEYSTORE_KEYPASS=ci-throwaway \
            -e OIE_HEAP_MAX=768m \
            -e SERVER_STARTUP_DEPLOY=false \
            -v "${{ github.workspace }}/extensions:/opt/engine/custom-extensions:ro" \
            oie/engine:${OIE_VERSION}

      - name: Bootstrap the admin password
        env:
          OIE_URL: "https://127.0.0.1:8443/api"
          OIE_INSECURE: "true"
          OIE_ADMIN_PASSWORD: "ci-throwaway-admin"
        run: ./scripts/oie-bootstrap-admin.sh

      - name: Assert every plugin extension actually loaded
        env:
          OIE_URL: "https://127.0.0.1:8443/api"
          OIE_INSECURE: "true"
          OIE_PASSWORD: "ci-throwaway-admin"
        run: |
          # List what loaded (for the log), then assert the connectors the
          # fixture channels depend on are present. A rejected extension is not
          # reported by the API, so this is an explicit gate.
          ./scripts/oie-check-extensions.sh
          OIE_REQUIRED_EXTENSIONS="FHIR Listener,FHIR Sender,Null Sender,Random Generator,SFTP Listener,SFTP Sender" \
            ./scripts/oie-check-extensions.sh

      - name: Generate connector fixtures from the engine
        env:
          OIE_URL: "https://127.0.0.1:8443/api"
          OIE_INSECURE: "true"
          OIE_PASSWORD: "ci-throwaway-admin"
        run: |
          # FHIR Listener, FHIR Sender and SFTP Sender have no shipped example
          # channel, and hand-writing an XStream export is the InvalidChannel
          # trap this whole tier exists to catch. So the engine writes them: a
          # minimal seed per connector is POSTed, read back, proven not to be an
          # InvalidChannel stub, and written to test/fixtures/channels/. They
          # then flow through the same push-and-deploy assertion below.
          ./test/fixtures/generate-fixtures.sh
          ls -la test/fixtures/channels/

      - name: Push the fixture channels and prove each deploys
        env:
          OIE_URL: "https://127.0.0.1:8443/api"
          OIE_INSECURE: "true"
          OIE_PASSWORD: "ci-throwaway-admin"
          # test/fixtures holds one channel per connector type this repo builds,
          # each a real Administrator export (see test/fixtures/README.md). The
          # push creates, reads back, checks for the invalid-channel stub, and
          # deploys each -- a connector whose XML the engine cannot deserialise
          # (a misspelled property, a missing extension) fails the job here.
          OIE_CONFIG_DIR: "${{ github.workspace }}/test/fixtures"
        run: ./scripts/oie-config-push.sh

      - name: Push the real config/ too
        env:
          OIE_URL: "https://127.0.0.1:8443/api"
          OIE_INSECURE: "true"
          OIE_PASSWORD: "ci-throwaway-admin"
          DOWNSTREAM_FHIR_URL: "https://fhir.invalid"
          DOWNSTREAM_FHIR_TOKEN: "ci-placeholder"
        run: |
          # The same gate the deploy pipeline runs: everything actually tracked
          # in config/ must deserialise and deploy on a clean engine.
          ./scripts/oie-config-push.sh

      - name: Engine logs on failure
        if: failure()
        run: |
          echo "===== engine ====="; docker logs engine 2>&1 | tail -200 || true
          echo "===== db ====="; docker logs db 2>&1 | tail -50 || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f engine db 2>/dev/null || true
          docker network rm oie-ci 2>/dev/null || true
