stages:
  - validate
  - package
  - staging-plan
  - staging
  - production-plan
  - production

variables:
  SHARED_OUTPUTS_PROJECT: "infra/awsshardmoduleprod"
  SHARED_OUTPUTS_FILENAME: "au.deploy.json"
  OIE_VERSION: "4.6.0"
  OIE_SHA256: "7c82e79027e671277e1d78d0f7bbb1c53ddf1be476f1e80c2ddbfcf7855900ea"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE/oie:$CI_COMMIT_SHA"
  TF_ROOT: "$CI_PROJECT_DIR/infra/aws"
  TF_IN_AUTOMATION: "true"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.10
    entrypoint: [""]
  tags: [docker]
  before_script:
    - apk add --no-cache bash shellcheck
  script:
    - shellcheck scripts/*.sh
    - terraform -chdir="$TF_ROOT" fmt -check -recursive
    - terraform -chdir="$TF_ROOT" init -backend=false
    - terraform -chdir="$TF_ROOT" validate

build-image:
  stage: package
  image: docker:28-cli
  services: [docker:28-dind]
  tags: [docker]
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 2; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --build-arg "OIE_VERSION=$OIE_VERSION" --build-arg "OIE_SHA256=$OIE_SHA256" -t "$IMAGE_TAG" docker
    - docker push "$IMAGE_TAG"
  rules: [{if: '$CI_COMMIT_BRANCH'}]

fetch-shared-outputs:
  stage: package
  image: alpine:3.22
  tags: [docker]
  before_script:
    - apk add --no-cache curl jq
  script:
    - export SHARED_PROJECT_ID="$(printf %s "$SHARED_OUTPUTS_PROJECT" | jq -sRr @uri)"
    - 'curl --fail --location --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$SHARED_PROJECT_ID/jobs?scope=success&order_by=id&sort=desc&per_page=100" --output shared-jobs.json'
    - jq -r '.[].id' shared-jobs.json > shared-job-ids.txt
    - test -s shared-job-ids.txt
    - >-
      while read -r job_id; do
        artifact_url="$CI_API_V4_URL/projects/$SHARED_PROJECT_ID/jobs/$job_id/artifacts/$SHARED_OUTPUTS_FILENAME";
        if curl --fail --silent --show-error --location --header "JOB-TOKEN: $CI_JOB_TOKEN" "$artifact_url" --output shared-outputs.json; then
          test -s shared-outputs.json && echo "Using shared artifact from job $job_id" && break;
        fi;
      done < shared-job-ids.txt
    - test -s shared-outputs.json
    - jq empty shared-outputs.json
  artifacts:
    paths: [shared-outputs.json]
    expire_in: 1 day
.aws-oidc:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "https://$CI_SERVER_HOST"
  before_script:
    - apk add --no-cache aws-cli jq openssl
    - export AWS_REGION="${AWS_REGION:-ap-southeast-2}"
    - export AWS_DEPLOY_ROLE_ARN="$(jq -r '.gitlab_ci_deploy_role_arn // empty' shared-outputs.json)"
    - test -n "$AWS_DEPLOY_ROLE_ARN"
    - CREDS=$(aws sts assume-role-with-web-identity --role-arn "$AWS_DEPLOY_ROLE_ARN" --role-session-name "gitlab-$CI_PIPELINE_ID-$CI_JOB_ID" --web-identity-token "$GITLAB_OIDC_TOKEN")
    - export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .Credentials.AccessKeyId)
    - export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .Credentials.SecretAccessKey)
    - export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .Credentials.SessionToken)

push-ecr:
  extends: .aws-oidc
  stage: package
  image: docker:28-cli
  services: [docker:28-dind]
  tags: [docker]
  needs:
    - job: build-image
    - job: fetch-shared-outputs
      artifacts: true
  script:
    - until docker info >/dev/null 2>&1; do sleep 2; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - export AWS_ECR_REPOSITORY_URL="$(jq -r .ecr_repository_url shared-outputs.json)"
    - aws ecr get-login-password | docker login --username AWS --password-stdin "${AWS_ECR_REPOSITORY_URL%%/*}"
    - docker pull "$IMAGE_TAG"
    - docker tag "$IMAGE_TAG" "$AWS_ECR_REPOSITORY_URL:$CI_COMMIT_SHA"
    - docker push "$AWS_ECR_REPOSITORY_URL:$CI_COMMIT_SHA"
    # The ECS task's db-init container runs postgres:17-alpine, but the private
    # subnets have no internet route, so Fargate can only pull from our ECR.
    # Mirror it once under a fixed tag (infra/aws/ecs.tf references the same
    # tag); skip when present, in case the repository has immutable tags.
    - |
      if aws ecr describe-images --repository-name "${AWS_ECR_REPOSITORY_URL#*/}" --image-ids imageTag=postgres-17-alpine >/dev/null 2>&1; then
        echo "postgres-17-alpine already in ECR"
      else
        docker pull public.ecr.aws/docker/library/postgres:17-alpine
        docker tag public.ecr.aws/docker/library/postgres:17-alpine "$AWS_ECR_REPOSITORY_URL:postgres-17-alpine"
        docker push "$AWS_ECR_REPOSITORY_URL:postgres-17-alpine"
      fi
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]

# Each deployment is an environment + instance: staging runs the single
# instance "oie"; production runs oie1, oie2, ... as separate engines (see the
# production jobs at the end). The instance picks the Terraform state
# (environments/<env>-<instance>.backend.hcl), the AWS secret and the resource
# names.
.terraform-plan:
  extends: .aws-oidc
  variables: {DEPLOY_INSTANCE: oie}
  image:
    name: hashicorp/terraform:1.10
    entrypoint: [""]
  tags: [docker]
  needs:
    - job: push-ecr
    - job: fetch-shared-outputs
      artifacts: true
  script:
    - cp shared-outputs.json "$TF_ROOT/shared-outputs.json"
    - ': "${ENCRYPTION_KEY:?ENCRYPTION_KEY is required to decrypt the RDS master credentials}"'
    - export RDS_MASTER_USERNAME="${RDS_MASTER_USERNAME:-$(jq -r '.postgresql_db_master_username_enc // empty' shared-outputs.json | openssl enc -d -aes-256-cbc -pbkdf2 -salt -a -A -pass "pass:${ENCRYPTION_KEY}")}"
    - export RDS_MASTER_PASSWORD="${RDS_MASTER_PASSWORD:-$(jq -r '.postgresql_db_master_password_enc // empty' shared-outputs.json | openssl enc -d -aes-256-cbc -pbkdf2 -salt -a -A -pass "pass:${ENCRYPTION_KEY}")}"
    - ': "${RDS_MASTER_USERNAME:?RDS_MASTER_USERNAME could not be decrypted from shared-outputs.json (check ENCRYPTION_KEY) or supplied directly}"'
    - ': "${RDS_MASTER_PASSWORD:?RDS_MASTER_PASSWORD could not be decrypted from shared-outputs.json (check ENCRYPTION_KEY) or supplied directly}"'
    # The engine opens the keystore with KEYSTORE_PASSWORD and only reports a
    # mismatch at runtime (with the web server down), so prove the pair here.
    - ': "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD is required - it guards the engine keystore}"'
    - |
      if [ -n "${OIE_KEYSTORE_B64:-}" ]; then
        apk add --no-cache openjdk17-jre-headless >/dev/null
        printf '%s' "$OIE_KEYSTORE_B64" | base64 -d > /tmp/oie-keystore.jks
        if ! keytool -list -keystore /tmp/oie-keystore.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
          echo "KEYSTORE_PASSWORD does not open the keystore in OIE_KEYSTORE_B64 - set the password it was created with" >&2
          exit 1
        fi
        echo "KEYSTORE_PASSWORD opens the keystore in OIE_KEYSTORE_B64"
      fi
    # Optional, environment-scoped single sign-on (docs/sso.md). OIDC_ENABLED
    # unset passes nothing and the console owns the policy. Set, it pins the
    # policy from here: each OIDC_* variable that is set becomes an OIE_OIDC_*
    # override, which the console then shows read-only. Unset ones stay absent
    # (the extension reads a present-but-empty one as an override). The client
    # secret travels through the Secrets Manager secret, never the task's
    # plain environment. OIDC_AUTO_REDIRECT=true sends browsers straight to the
    # provider instead of showing the password form - it hides local sign-in,
    # it does not disable it: the API and the admin account still take a
    # password, which is the break-glass path.
    - |
      oidc_client_secret=""
      if [ -z "${OIDC_ENABLED:-}" ]; then
        for v in OIDC_DISCOVERY_URL OIDC_CLIENT_ID OIDC_CLIENT_SECRET OIDC_PROVIDER_LABEL OIDC_USERNAME_CLAIM OIDC_SCOPES OIDC_AUTO_REDIRECT; do
          if [ -n "$(eval "printf '%s' \"\${$v:-}\"")" ]; then
            echo "$v is set but OIDC_ENABLED is not - set OIDC_ENABLED=true (or false) to pin SSO from GitLab, or unset $v" >&2
            exit 1
          fi
        done
        echo "OIDC_ENABLED unset - SSO is configured in the console"
      else
        case "$OIDC_ENABLED" in true|false) ;; *) echo "OIDC_ENABLED must be true or false, not '$OIDC_ENABLED'" >&2; exit 1 ;; esac
        case "${OIDC_AUTO_REDIRECT:-}" in ""|false) ;; true)
          [ "$OIDC_ENABLED" = true ] || { echo "OIDC_AUTO_REDIRECT=true needs OIDC_ENABLED=true" >&2; exit 1; } ;;
          *) echo "OIDC_AUTO_REDIRECT must be true or false, not '$OIDC_AUTO_REDIRECT'" >&2; exit 1 ;;
        esac
        if [ "$OIDC_ENABLED" = true ]; then
          for v in OIDC_DISCOVERY_URL OIDC_CLIENT_ID OIDC_CLIENT_SECRET; do
            if [ -z "$(eval "printf '%s' \"\${$v:-}\"")" ]; then
              echo "OIDC_ENABLED=true needs $v" >&2
              exit 1
            fi
          done
        fi
        oidc_client_secret="${OIDC_CLIENT_SECRET:-}"
        TF_VAR_oidc_settings="$(jq -nc \
          --arg enabled "$OIDC_ENABLED" \
          --arg webadmin "https://$OIE_HOSTNAME/oie-webadmin" \
          --arg discovery "${OIDC_DISCOVERY_URL:-}" \
          --arg client "${OIDC_CLIENT_ID:-}" \
          --arg label "${OIDC_PROVIDER_LABEL:-}" \
          --arg claim "${OIDC_USERNAME_CLAIM:-}" \
          --arg scopes "${OIDC_SCOPES:-}" \
          --arg redirect "${OIDC_AUTO_REDIRECT:-}" \
          '{OIE_OIDC_ENABLED: $enabled, OIE_OIDC_WEB_ADMINISTRATOR_URL: $webadmin, OIE_OIDC_DISCOVERY_URL: $discovery, OIE_OIDC_CLIENT_ID: $client, OIE_OIDC_PROVIDER_LABEL: $label, OIE_OIDC_USERNAME_CLAIM: $claim, OIE_OIDC_SCOPES: $scopes, OIE_OIDC_AUTO_REDIRECT: $redirect} | with_entries(select(.value != ""))')"
        export TF_VAR_oidc_settings
        if [ -n "$oidc_client_secret" ]; then export TF_VAR_oidc_client_secret_set=true; fi
        echo "SSO pinned from GitLab: $(printf '%s' "$TF_VAR_oidc_settings" | jq -c .)${oidc_client_secret:+ + OIE_OIDC_CLIENT_SECRET (from the secret)}"
        echo "Register https://$OIE_HOSTNAME/oie-webadmin/oidc/callback as the redirect URI at the provider"
      fi
    - export SECRET_NAME="au-$DEPLOY_ENV-$DEPLOY_INSTANCE-secrets"
    - jq -nc --arg u "$RDS_MASTER_USERNAME" --arg p "$RDS_MASTER_PASSWORD" --arg a "$OIE_ADMIN_PASSWORD" --arg k "$KEYSTORE_PASSWORD" --arg j "$OIE_KEYSTORE_B64" --arg o "$oidc_client_secret" '{DATABASE_USERNAME:$u,DATABASE_PASSWORD:$p,OIE_ADMIN_PASSWORD:$a,KEYSTORE_PASSWORD:$k,KEYSTORE_BASE64:$j} + (if $o == "" then {} else {OIE_OIDC_CLIENT_SECRET:$o} end)' > /tmp/oie-secret.json
    - aws secretsmanager describe-secret --secret-id "$SECRET_NAME" >/dev/null 2>&1 || aws secretsmanager create-secret --name "$SECRET_NAME" --secret-string file:///tmp/oie-secret.json >/dev/null
    - aws secretsmanager put-secret-value --secret-id "$SECRET_NAME" --secret-string file:///tmp/oie-secret.json >/dev/null
    - export TF_VAR_app_secret_arn=$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --query ARN --output text)
    - export TF_VAR_rds_endpoint="${RDS_ENDPOINT:-$(jq -r '.postgresql_db_instance_address | (.value? // .) // empty' shared-outputs.json)}"
    - ': "${RDS_DATABASE_NAME:?RDS_DATABASE_NAME must identify the database/schema on the shared RDS instance}"'
    - export TF_VAR_rds_database_name="$RDS_DATABASE_NAME"
    - export TF_VAR_rds_security_group_id="${RDS_SECURITY_GROUP_ID:-$(jq -r '.postgresql_db_security_group_id | (.value? // .) // empty' shared-outputs.json)}"
    - ': "${TF_VAR_rds_endpoint:?RDS endpoint was not found in shared-outputs.json or RDS_ENDPOINT}"'
    - ': "${TF_VAR_rds_security_group_id:?RDS security group was not found in shared-outputs.json or RDS_SECURITY_GROUP_ID}"'
    - export TF_VAR_region="$AWS_REGION" TF_VAR_environment="$DEPLOY_ENV" TF_VAR_instance="$DEPLOY_INSTANCE" TF_VAR_image_tag="$CI_COMMIT_SHA"
    - export TF_VAR_shared_outputs_path="$TF_ROOT/shared-outputs.json" TF_VAR_admin_host_header="$OIE_HOSTNAME"
    - export TF_VAR_alb_listener_rule_priority="$AWS_ALB_PRIORITY"
    - ': "${AWS_ALB_REDIRECT_PRIORITY:?AWS_ALB_REDIRECT_PRIORITY must be set - the / redirect rule priority, lower than AWS_ALB_PRIORITY}"'
    - export TF_VAR_alb_redirect_rule_priority="$AWS_ALB_REDIRECT_PRIORITY"
    # The HTTPS listener is shared with other apps, and CreateRule fails mid-apply
    # on a taken priority. List the rules and fail here instead, naming the clash.
    - |
      listener="$(jq -r '.alb_https_listener_arn | (.value? // .) // empty' shared-outputs.json)"
      aws elbv2 describe-rules --listener-arn "$listener" --output json \
        | jq -r '.Rules[] | select(.IsDefault | not) | "\(.Priority) \([.Conditions[] | select(.Field == "host-header") | (.HostHeaderConfig.Values // .Values // [])[]] | join(","))"' \
        | sort -n > /tmp/alb-rules.txt
      echo "Shared ALB listener rules (priority host):"; cat /tmp/alb-rules.txt
      for p in "$AWS_ALB_PRIORITY" "$AWS_ALB_REDIRECT_PRIORITY"; do
        clash="$(awk -v p="$p" -v h="$OIE_HOSTNAME" '$1 == p && $2 != h' /tmp/alb-rules.txt)"
        if [ -n "$clash" ]; then
          echo "ALB listener priority $p is already used by another app's rule ($clash) - pick an unused one" >&2
          exit 1
        fi
      done
    - export TF_VAR_nlb_security_group_id="${NLB_SECURITY_GROUP_ID:-$(jq -r '.nlb_security_group_id | (.value? // .) // empty' shared-outputs.json)}"
    - ': "${TF_VAR_nlb_security_group_id:?NLB security group was not found in shared-outputs.json or NLB_SECURITY_GROUP_ID}"'
    - export TF_VAR_nlb_arn="${NLB_ARN:-$(jq -r '.nlb_arn | (.value? // .) // empty' shared-outputs.json)}"
    - ': "${TF_VAR_nlb_arn:?NLB ARN was not found in shared-outputs.json or NLB_ARN}"'
    - export TF_VAR_efs_mount_target_subnet_ids="${EFS_MOUNT_TARGET_SUBNET_IDS:-[]}"
    - export TF_VAR_keystore_reset="${KEYSTORE_RESET:-}"
    - 'if [ -n "${OIE_EXTENSION_URLS:-}" ]; then export TF_VAR_extension_urls="$(jq -cRn --arg s "$OIE_EXTENSION_URLS" ''$s | split(",")'')"; fi'
    # Optional, environment-scoped: CHANNEL_PORT_COUNT opens the first N ports
    # of the deployment's reserved range (default 4); CHANNEL_PORT_SOURCES
    # restricts ports to a source, as port=address-or-CIDR pairs, e.g.
    # "50003=203.0.113.7,50004=10.1.0.0/16" (on top of TRUSTED_CIDRS).
    - 'if [ -n "${CHANNEL_PORT_COUNT:-}" ]; then export TF_VAR_channel_port_count="$CHANNEL_PORT_COUNT"; fi'
    - 'if [ -n "${CHANNEL_PORT_SOURCES:-}" ]; then TF_VAR_channel_port_sources="$(jq -cRn --arg s "$CHANNEL_PORT_SOURCES" ''$s | gsub("[[:space:]]"; "") | split(",") | map(select(. != "") | split("=") | if length == 2 then {(.[0]): .[1]} else error("CHANNEL_PORT_SOURCES entries must be port=source, not \(join("="))") end) | add // {}'')"; export TF_VAR_channel_port_sources; fi'
    # TRUSTED_CIDRS: up to 3 comma-separated addresses or CIDRs - the only
    # sources that reach the console through the ALB, also allowed on restricted
    # channel ports. Unset leaves the console public.
    - 'if [ -n "${TRUSTED_CIDRS:-}" ]; then TF_VAR_trusted_cidrs="$(jq -cRn --arg s "$TRUSTED_CIDRS" ''$s | gsub("[[:space:]]"; "") | split(",") | map(select(. != ""))'')"; export TF_VAR_trusted_cidrs; fi'
    - terraform -chdir="$TF_ROOT" init -backend-config="environments/$DEPLOY_ENV-$DEPLOY_INSTANCE.backend.hcl"
    # The NLB is shared too, and this deployment's whole reserved port range is
    # its own: fail if another app has a listener anywhere in it (CreateListener
    # would also fail mid-apply on a taken port). A listener is ours when it
    # forwards to this deployment's target group for that port.
    - |
      # Each step on its own line: a failure inside a pipe would go unnoticed and
      # leave nothing to check against.
      echo 'jsonencode(local.channel_port_range)' | terraform -chdir="$TF_ROOT" console > /tmp/channel-range.txt
      range="$(jq -r 'fromjson | "\(.min) \(.max)"' /tmp/channel-range.txt)"
      aws elbv2 describe-listeners --load-balancer-arn "$TF_VAR_nlb_arn" --output json > /tmp/nlb-listeners.json
      jq -r '.Listeners[] | "\(.Port) \(.DefaultActions[0].TargetGroupArn // "" | sub(".*:targetgroup/"; "") | sub("/.*"; ""))"' /tmp/nlb-listeners.json         | sort -n > /tmp/nlb-listeners.txt
      echo "Shared NLB listeners (port target-group):"; cat /tmp/nlb-listeners.txt
      clash="$(awk -v min="${range% *}" -v max="${range#* }" -v name="au-$DEPLOY_ENV-$DEPLOY_INSTANCE" '$1 >= min && $1 <= max && $2 != name "-" $1' /tmp/nlb-listeners.txt)"
      if [ -n "$clash" ]; then
        echo "Another app has NLB listeners in this deployment's reserved port range ($range):" >&2
        echo "$clash" >&2
        exit 1
      fi
    - terraform -chdir="$TF_ROOT" plan -out="$CI_PROJECT_DIR/$DEPLOY_ENV-$DEPLOY_INSTANCE.tfplan"
  artifacts:
    paths: ["$DEPLOY_ENV-$DEPLOY_INSTANCE.tfplan", "infra/aws/.terraform", "infra/aws/.terraform.lock.hcl", "infra/aws/shared-outputs.json"]
    expire_in: 1 day

.terraform-apply:
  extends: .aws-oidc
  variables: {DEPLOY_INSTANCE: oie}
  image:
    name: hashicorp/terraform:1.10
    entrypoint: [""]
  tags: [docker]
  script:
    - terraform -chdir="$TF_ROOT" init -input=false -backend-config="environments/$DEPLOY_ENV-$DEPLOY_INSTANCE.backend.hcl"
    - terraform -chdir="$TF_ROOT" apply -auto-approve "$CI_PROJECT_DIR/$DEPLOY_ENV-$DEPLOY_INSTANCE.tfplan"

plan-aws-staging:
  extends: .terraform-plan
  stage: staging-plan
  variables: {DEPLOY_ENV: staging, OIE_HOSTNAME: "$OIE_STAGING_HOSTNAME"}
  environment: {name: staging, action: prepare}
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]

deploy-aws-staging:
  extends: .terraform-apply
  stage: staging
  needs:
    - job: plan-aws-staging
    - job: fetch-shared-outputs
      artifacts: true
  variables: {DEPLOY_ENV: staging}
  environment: {name: staging, url: "https://$OIE_STAGING_HOSTNAME"}
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]

deploy-local-k8s:
  stage: staging
  image: alpine:3.22
  tags: [docker]
  needs: [build-image]
  before_script:
    # openssl for password generation, openjdk for keytool (keystore generation),
    # both used only when the corresponding CI variable is unset (see the script).
    - apk add --no-cache bash kubectl openssl openjdk17-jre-headless
  script: ["bash scripts/oie-deploy-local-k8s.sh"]
  environment: {name: local-k8s}
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]

# Production instances. Each is its own engine at <instance>.htrak.com, unless
# its jobs set OIE_HOSTNAME (oie1 is at oie.htrak.com: oie1.htrak.com is the
# EC2 instance, deploy/ec2), with its own GitLab environment, production/<instance>, which scopes its variables:
# RDS_DATABASE_NAME, AWS_ALB_PRIORITY, AWS_ALB_REDIRECT_PRIORITY,
# KEYSTORE_PASSWORD, OIE_KEYSTORE_B64 (and optionally TRUSTED_CIDRS, KEYSTORE_RESET,
# OIE_EXTENSION_URLS, CHANNEL_PORT_COUNT, CHANNEL_PORT_SOURCES). To add oie2: copy the two oie1 jobs below, add
# infra/aws/environments/production-oie2.backend.hcl and an NLB port range in
# infra/aws/locals.tf, and set those variables for production/oie2.
.plan-aws-production:
  extends: .terraform-plan
  stage: production-plan
  needs:
    - job: deploy-aws-staging
    - job: push-ecr
    - job: fetch-shared-outputs
      artifacts: true
  variables: {DEPLOY_ENV: production, OIE_HOSTNAME: "$DEPLOY_INSTANCE.htrak.com"}
  environment: {name: production/$DEPLOY_INSTANCE, action: prepare}
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]

.deploy-aws-production:
  extends: .terraform-apply
  stage: production
  variables: {DEPLOY_ENV: production, OIE_HOSTNAME: "$DEPLOY_INSTANCE.htrak.com"}
  environment: {name: production/$DEPLOY_INSTANCE, url: "https://$OIE_HOSTNAME"}
  when: manual
  allow_failure: false
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]

plan-aws-production-oie1:
  extends: .plan-aws-production
  variables: {DEPLOY_INSTANCE: oie1, OIE_HOSTNAME: oie.htrak.com}

deploy-aws-production-oie1:
  extends: .deploy-aws-production
  needs:
    - job: plan-aws-production-oie1
    - job: fetch-shared-outputs
      artifacts: true
  variables: {DEPLOY_INSTANCE: oie1, OIE_HOSTNAME: oie.htrak.com}

# The EC2 instance running without Docker (deploy/ec2) at oie1.htrak.com.
# Builds the installer bundle, publishes the *.htrak.com certificate
# (TLS_CERT_PEM/TLS_KEY_PEM) to SSM, uploads the bundle to this project's
# package registry and has SSM Run Command download and install it on the
# instance -- nothing connects to the instance directly. Scoped to
# production/oie1: EC2_INSTANCE_NAME (the instance's Name tag) and
# EC2_SSM_PATH. See deploy/ec2/README.md.
deploy-ec2-production-oie1:
  extends: .aws-oidc
  stage: production
  image: alpine:3.22
  tags: [docker]
  needs:
    - job: fetch-shared-outputs
      artifacts: true
  script:
    - apk add --no-cache bash curl
    - bash deploy/ec2/deploy.sh
  environment: {name: production/oie1}
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
