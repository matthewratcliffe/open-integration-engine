include:
  - project: "infra/awsshardmoduleprod"
    ref: master
    file: "ci/consume-shared-outputs.yml"

stages:
  - validate
  - package
  - staging-plan
  - staging
  - production-plan
  - production

variables:
  OIE_VERSION: "4.6.0"
  OIE_SHA256: "7c82e79027e671277e1d78d0f7bbb1c53ddf1be476f1e80c2ddbfcf7855900ea"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE/oie:$CI_COMMIT_SHA"
  TF_ROOT: "$CI_PROJECT_DIR/infra/aws"
  TF_IN_AUTOMATION: "true"

validate:
  stage: validate
  image: hashicorp/terraform:1.10
  tags: [docker]
  before_script:
    - apk add --no-cache bash shellcheck
  script:
    - shellcheck scripts/*.sh
    - terraform -chdir="$TF_ROOT" fmt -check -recursive
    - terraform -chdir="$TF_ROOT" init -backend=false
    - terraform -chdir="$TF_ROOT" validate

build-image:
  stage: package
  image: docker:28-cli
  services: [docker:28-dind]
  tags: [docker]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --build-arg "OIE_VERSION=$OIE_VERSION" --build-arg "OIE_SHA256=$OIE_SHA256" -t "$IMAGE_TAG" docker
    - docker push "$IMAGE_TAG"
  rules: [{if: '$CI_COMMIT_BRANCH'}]

fetch-shared-outputs:
  stage: package
  extends: .fetch_shared_outputs
  tags: [docker]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.aws-oidc:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "https://$CI_SERVER_HOST"
  before_script:
    - apk add --no-cache aws-cli jq
    - export AWS_REGION="${AWS_REGION:-ap-southeast-2}"
    - export AWS_DEPLOY_ROLE_ARN="$(jq -r '.gitlab_ci_deploy_role_arn // empty' shared-outputs.json)"
    - test -n "$AWS_DEPLOY_ROLE_ARN"
    - CREDS=$(aws sts assume-role-with-web-identity --role-arn "$AWS_DEPLOY_ROLE_ARN" --role-session-name "gitlab-$CI_PIPELINE_ID-$CI_JOB_ID" --web-identity-token "$GITLAB_OIDC_TOKEN")
    - export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .Credentials.AccessKeyId)
    - export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .Credentials.SecretAccessKey)
    - export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .Credentials.SessionToken)

push-ecr:
  extends: .aws-oidc
  stage: package
  image: docker:28-cli
  services: [docker:28-dind]
  tags: [docker]
  needs:
    - job: build-image
    - job: fetch-shared-outputs
      artifacts: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - export AWS_ECR_REPOSITORY_URL="$(jq -r .ecr_repository_url shared-outputs.json)"
    - aws ecr get-login-password | docker login --username AWS --password-stdin "${AWS_ECR_REPOSITORY_URL%%/*}"
    - docker pull "$IMAGE_TAG"
    - docker tag "$IMAGE_TAG" "$AWS_ECR_REPOSITORY_URL:$CI_COMMIT_SHA"
    - docker push "$AWS_ECR_REPOSITORY_URL:$CI_COMMIT_SHA"
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]

.terraform-plan:
  extends: .aws-oidc
  image: hashicorp/terraform:1.10
  tags: [docker]
  needs:
    - job: push-ecr
    - job: fetch-shared-outputs
      artifacts: true
  script:
    - cp shared-outputs.json "$TF_ROOT/shared-outputs.json"
    - ': "${RDS_MASTER_USERNAME:?RDS_MASTER_USERNAME is required}"'
    - ': "${RDS_MASTER_PASSWORD:?RDS_MASTER_PASSWORD is required}"'
    - export SECRET_NAME="au-$DEPLOY_ENV-oie-secrets"
    - jq -nc --arg u "$RDS_MASTER_USERNAME" --arg p "$RDS_MASTER_PASSWORD" --arg a "$OIE_ADMIN_PASSWORD" --arg k "$KEYSTORE_PASSWORD" --arg j "$OIE_KEYSTORE_B64" '{DATABASE_USERNAME:$u,DATABASE_PASSWORD:$p,OIE_ADMIN_PASSWORD:$a,KEYSTORE_PASSWORD:$k,KEYSTORE_BASE64:$j}' > /tmp/oie-secret.json
    - aws secretsmanager describe-secret --secret-id "$SECRET_NAME" >/dev/null 2>&1 || aws secretsmanager create-secret --name "$SECRET_NAME" --secret-string file:///tmp/oie-secret.json >/dev/null
    - aws secretsmanager put-secret-value --secret-id "$SECRET_NAME" --secret-string file:///tmp/oie-secret.json >/dev/null
    - export TF_VAR_app_secret_arn=$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --query ARN --output text)
    - export TF_VAR_rds_endpoint="${RDS_ENDPOINT:-$(jq -r '.postgresql_db_instance_address.value // .postgresql_db_instance_address // empty' shared-outputs.json)}"
    - ': "${RDS_DATABASE_NAME:?RDS_DATABASE_NAME must identify the database/schema on the shared RDS instance}"'
    - export TF_VAR_rds_database_name="$RDS_DATABASE_NAME"
    - export TF_VAR_rds_security_group_id="${RDS_SECURITY_GROUP_ID:-$(jq -r '.postgresql_db_security_group_id.value // .postgresql_db_security_group_id // empty' shared-outputs.json)}"
    - ': "${TF_VAR_rds_endpoint:?RDS endpoint was not found in shared-outputs.json or RDS_ENDPOINT}"'
    - ': "${TF_VAR_rds_security_group_id:?RDS security group was not found in shared-outputs.json or RDS_SECURITY_GROUP_ID}"'
    - export TF_VAR_region="$AWS_REGION" TF_VAR_environment="$DEPLOY_ENV" TF_VAR_image_tag="$CI_COMMIT_SHA"
    - export TF_VAR_shared_outputs_path="$TF_ROOT/shared-outputs.json" TF_VAR_admin_host_header="$OIE_HOSTNAME"
    - export TF_VAR_alb_listener_rule_priority="$AWS_ALB_PRIORITY" TF_VAR_nlb_security_group_id="$(jq -r '.nlb_security_group_id.value // .nlb_security_group_id // empty' shared-outputs.json)"
    - terraform -chdir="$TF_ROOT" init -backend-config="bucket=$AWS_TF_STATE_BUCKET" -backend-config="key=oie/$DEPLOY_ENV.tfstate" -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$AWS_TF_LOCK_TABLE"
    - terraform -chdir="$TF_ROOT" plan -out="$CI_PROJECT_DIR/$DEPLOY_ENV.tfplan"
  artifacts:
    paths: ["$DEPLOY_ENV.tfplan", "infra/aws/.terraform", "infra/aws/.terraform.lock.hcl", "infra/aws/shared-outputs.json"]
    expire_in: 1 day

.terraform-apply:
  extends: .aws-oidc
  image: hashicorp/terraform:1.10
  tags: [docker]
  script:
    - terraform -chdir="$TF_ROOT" init -input=false -backend-config="bucket=$AWS_TF_STATE_BUCKET" -backend-config="key=oie/$DEPLOY_ENV.tfstate" -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$AWS_TF_LOCK_TABLE"
    - terraform -chdir="$TF_ROOT" apply -auto-approve "$CI_PROJECT_DIR/$DEPLOY_ENV.tfplan"
    - terraform -chdir="$TF_ROOT" output existing_nlb_listener_requirements

plan-aws-staging:
  extends: .terraform-plan
  stage: staging-plan
  variables: {DEPLOY_ENV: staging, OIE_HOSTNAME: "$OIE_STAGING_HOSTNAME"}
  environment: {name: staging, action: prepare}
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]

deploy-aws-staging:
  extends: .terraform-apply
  stage: staging
  needs: [plan-aws-staging]
  variables: {DEPLOY_ENV: staging}
  environment: {name: staging, url: "https://$OIE_STAGING_HOSTNAME"}
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]

deploy-local-k8s:
  stage: staging
  image: alpine:3.22
  tags: [docker]
  needs: [build-image]
  before_script:
    - export RDS_MASTER_USERNAME="$RDS_MASTER_USERNAME" RDS_MASTER_PASSWORD="$RDS_MASTER_PASSWORD"
    - apk add --no-cache bash kubectl
  script: ["bash scripts/oie-deploy-local-k8s.sh"]
  environment: {name: local-k8s}
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]

plan-aws-production:
  extends: .terraform-plan
  stage: production-plan
  needs:
    - job: deploy-aws-staging
    - job: push-ecr
    - job: fetch-shared-outputs
      artifacts: true
  variables: {DEPLOY_ENV: production, OIE_HOSTNAME: "$OIE_PRODUCTION_HOSTNAME"}
  environment: {name: production, action: prepare}
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]

deploy-aws-production:
  extends: .terraform-apply
  stage: production
  needs: [plan-aws-production]
  variables: {DEPLOY_ENV: production}
  environment: {name: production, url: "https://$OIE_PRODUCTION_HOSTNAME"}
  when: manual
  allow_failure: false
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]
