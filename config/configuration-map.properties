# Configuration map -- key/value settings your channels read at runtime with
# configurationMap.get('name'), instead of hard-coding endpoints in a transformer.
#
# ${ENV_VAR} is expanded by scripts/oie-config-push.sh at push time, so
# per-environment values and secrets stay out of git and come from GitLab CI
# variables instead.

downstream.fhir.url = ${DOWNSTREAM_FHIR_URL}
downstream.fhir.token = ${DOWNSTREAM_FHIR_TOKEN}
